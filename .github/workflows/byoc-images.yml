name: BYOC images (GHCR)
run-name: BYOC images — ${{ github.ref_name }} @ ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - 'BYOC'

permissions:
  contents: read
  packages: write

env:
  DOCKER_CONTAINER_REGISTRY_HOSTNAME: ghcr.io
  DOCKER_CONTAINER_REGISTRY_NAMESPACE: bmann
  DOCKER_CONTAINER_IMAGE_NAMESPACE: lasuitedrive
  IMAGE_TAG: byoc

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ghcr.io/${{ env.DOCKER_CONTAINER_REGISTRY_NAMESPACE }}/${{ env.DOCKER_CONTAINER_IMAGE_NAMESPACE }}/drive-backend
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=sha,format=short
          flavor: |
            latest=auto
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: backend-production
          platforms: linux/amd64
          build-args: DOCKER_USER=1001:127:-1000
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-and-push-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ghcr.io/${{ env.DOCKER_CONTAINER_REGISTRY_NAMESPACE }}/${{ env.DOCKER_CONTAINER_IMAGE_NAMESPACE }}/drive-frontend
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=sha,format=short
          flavor: |
            latest=auto
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./src/frontend/Dockerfile
          target: frontend-production
          platforms: linux/amd64
          build-args: DOCKER_USER=1001:127:-1000
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}